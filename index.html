var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------
  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],

const tokenValido=u=>u.ativo!==false&&u.token&&new Date(u.token.expiraEm)>new Date();
function revogarToken(u){if(!u.token)return;(S.revogados||(S.revogados=[])).push({jti:u.token.jti,usuarioId:u.id,expiraEm:u.token.expiraEm,revogadoEm:new Date().toISOString()});u.token=null}
async function emitirToken(u){
  revogarToken(u);const agora=Math.floor(Date.now()/1000),jti=uuid();
  const h=b64u(JSON.stringify({alg:'HS256',typ:'JWT'})),p=b64u(JSON.stringify({sub:u.id,nome:u.nome,matricula:u.matricula,email:u.email,perfil:u.papel,setor_id:u.setorId,jti,iat:agora,exp:agora+TOKEN_HORAS*3600}));
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(SEGREDO_DEMO),{name:'HMAC',hash:'SHA-256'},false,['sign']);
  const sig=b64uBuf(await crypto.subtle.sign('HMAC',k,new TextEncoder().encode(h+'.'+p)));
  u.token={jti,valor:h+'.'+p+'.'+sig,emitidoEm:new Date(agora*1000).toISOString(),expiraEm:new Date((agora+TOKEN_HORAS*3600)*1000).toISOString()};return u.token}
async function garantirTokens(){for(const u of S.users)if(u.ativo!==false&&!tokenValido(u))await emitirToken(u)}

const tam=b=>b>=1048576?(b/1048576).toFixed(1).replace('.',',')+' MB':Math.round(b/1024)+' KB';

async function mov(ev,acao,o={}){
  const c=S.cadeia[ev.id]||(S.cadeia[ev.id]=[]);const u=o.user||me();
  const r={seq:c.length+1,evidenciaId:ev.id,acao,registradoPor:u.nome,responsavel:o.responsavel||u.nome,setorId:o.setorId||null,destino:o.destino||'',local:o.local||'',dataHora:o.at||new Date().toISOString(),observacao:o.obs||'',geo:GEO,hashAnterior:c.length?c[c.length-1].hashRegistro:ZERO};
  r.hashRegistro=await hashRec(r);c.push(r);return r;
}

/* ---------- operações (regras de negócio) ---------- */
async function opAssociar(ev,u,d,at){
  let l;const num=(d.numero||'').trim();
  if(!num)return 'Informe o número do lacre.';
  if(d.externo){
    if(S.lacres.some(x=>x.numero.toLowerCase()===num.toLowerCase()))return `O lacre ${num} já foi registrado em outra evidência e não pode ser reaproveitado.`;
    l={id:'lc'+(++S.seq),numero:num,externo:true,emissor:d.emissor||'outro',loteId:null,status:'disponivel',refs:[],geradoEm:at||new Date().toISOString()};S.lacres.push(l);
  }else{
    l=S.lacres.find(x=>!x.externo&&x.numero.toLowerCase()===num.toLowerCase());
    if(!l)return `Não existe lacre do Instituto com o número ${num}. Confira a etiqueta ou registre como lacre externo.`;
    if(l.status==='vinculado')return `O lacre ${l.numero} já está vinculado à evidência ${evById(l.evidenciaId)?.codigo}. Um lacre não pode ser usado em duas evidências.`;
    if(l.status==='rompido')return `O lacre ${l.numero} foi rompido e não pode ser reutilizado.`;
  }
  Object.assign(l,{status:'vinculado',evidenciaId:ev.id,hashNoMomento:ev.hashFoto,vinculadoPor:u.nome,vinculadoEm:at||new Date().toISOString()});
  ev.teveLacre=true;ev.rompidoPorId=null;
  await mov(ev,'Lacre associado',{user:u,at,setorId:ev.setorAtualId,obs:`Lacre ${l.numero} (${EMISSOR[l.emissor]})`});
  return null;
}
async function opRomper(ev,u,motivo,at){
  const l=lacreAtivo(ev);if(!l)return;
  Object.assign(l,{status:'rompido',rompidoPor:u.nome,motivo,rompidoEm:at||new Date().toISOString()});ev.rompidoPorId=u.id;
  await mov(ev,'Lacre rompido',{user:u,at,setorId:ev.setorAtualId,obs:`Lacre ${l.numero}. Motivo: ${motivo}`});
}
async function opEncaminhar(ev,u,d,at){
  ev.status='em_transito';ev.setorAtualId=null;ev.aguardandoAnalise=false;
  if(d.externo){ev.destinoExterno={nome:d.nome,endereco:d.endereco};ev.setorPendenteId=null}
  else{ev.setorPendenteId=d.setorId;ev.destinoExterno=null}
  await mov(ev,'Encaminhado',{user:u,at,responsavel:d.transportador||u.nome,destino:d.externo?`${d.nome} (externo), ${d.endereco}`:sn(d.setorId),obs:d.obs});
}
async function opReceber(ev,u,obs,at){
  if(ev.destinoExterno){ev.status='externo';await mov(ev,'Chegada confirmada em destino externo',{user:u,at,local:`${ev.destinoExterno.nome}, ${ev.destinoExterno.endereco}`,obs})}
  else{ev.status='recebida';ev.setorAtualId=ev.setorPendenteId;ev.setorPendenteId=null;ev.aguardandoAnalise=true;await mov(ev,'Recebido',{user:u,at,setorId:ev.setorAtualId,obs})}
}
async function opAssumir(ev,u,obs,at){ev.status='em_analise';ev.peritoId=u.id;ev.aguardandoAnalise=false;await mov(ev,'Em análise',{user:u,at,setorId:ev.setorAtualId,obs})}
async function opConcluir(ev,u,obs,at){ev.status='analisada';ev.peritoId=null;await mov(ev,'Analisado',{user:u,at,setorId:ev.setorAtualId,obs})}
async function opArmazenar(ev,u,sid,obs,at){ev.status='armazenada';ev.setorAtualId=sid;ev.destinoExterno=null;ev.aguardandoAnalise=false;await mov(ev,'Armazenado',{user:u,at,setorId:sid,obs})}
async function opDevolver(ev,u,para,obs,at){ev.status='devolvida';ev.setorAtualId=null;ev.setorPendenteId=null;ev.aguardandoAnalise=false;await mov(ev,'Devolvido',{user:u,at,destino:para,obs})}
function novoLote(u,qtd,at){
  const id='L-2026-'+String(S.lotes.length+1).padStart(4,'0'),num=k=>'IC-2026-'+String(k).padStart(6,'0');
  S.lotes.push({id,qtd,por:u.nome,geradoEm:at||new Date().toISOString(),primeiro:num(S.seqLacre+1),ultimo:num(S.seqLacre+qtd)});
  for(let i=0;i<qtd;i++)S.lacres.push({id:'lc'+(++S.seq),numero:'IC-2026-'+String(++S.seqLacre).padStart(6,'0'),externo:false,emissor:'instituto',loteId:id,status:'disponivel',refs:[],geradoEm:at||new Date().toISOString()});
  return id;
}
function vincularOcorrencia(d,u){
  const vazio=!d||!Object.values(d).some(v=>String(v||'').trim());
  if(vazio)return null;
  const bos=(d.bos||'').split(/[,;\n]/).map(s=>s.trim()).filter(Boolean);
  let oc=d.gigante&&S.ocorrencias.find(o=>o.gigante&&o.gigante.toLowerCase()===d.gigante.trim().toLowerCase());
  if(oc){bos.forEach(b=>{if(!oc.bos.includes(b))oc.bos.push(b)});['oficio','delegacia','crime','endereco','obs','dataHora'].forEach(k=>{if(!oc[k]&&d[k])oc[k]=d[k].trim()})}
  else{oc={id:'oc'+(++S.seq),gigante:(d.gigante||'').trim(),dataHora:d.dataHora||'',oficio:d.oficio||'',delegacia:d.delegacia||'',crime:d.crime||'',endereco:d.endereco||'',obs:d.obs||'',bos,criadaPor:u.nome,criadaEm:new Date().toISOString()};S.ocorrencias.push(oc)}
  return oc.id;
}
async function novaEvidencia(u,d,at){
  const ev={id:'ev'+(++S.seq),codigo:d.codigo,tipo:d.tipo,descricao:d.descricao,endereco:d.endereco,lat:d.lat||'',lng:d.lng||'',ocorrenciaId:d.ocorrenciaId||null,fotoNome:d.fotoNome||'',fotoTipo:d.fotoTipo||'',fotoTamanho:d.fotoTamanho||0,fotoCaminho:d.fotoNome?`evidencias/${d.codigo}/${d.fotoNome}`:'',hashFoto:d.hashFoto||'',coletadoPor:u.nome,coletadoEm:at||new Date().toISOString(),status:'coletada',setorAtualId:null,setorPendenteId:null,destinoExterno:null,aguardandoAnalise:false,peritoId:null,teveLacre:false,rompidoPorId:null};
  S.evidencias.push(ev);
  await mov(ev,'Coletado',{user:u,at,local:d.endereco,obs:[d.fora?`Cadastro feito fora do local indicado. Justificativa: ${d.justificativa}`:'Cadastro feito no local indicado.',d.hashFoto?`SHA-256 da foto: ${d.hashFoto}`:'Sem foto anexada.'].join(' ')});
  return ev;
}

const AVC=['#3B5B8C','#7A4FBF','#0A7A55','#B4532A','#2F6F8F','#9B2C5A'];
const ini=n=>n.split(' ').map(x=>x[0]).slice(0,2).join('');
const av=(u,sm)=>`<span class="av ${sm?'sm':''}" style="--avc:${AVC[(+u.id.slice(1)||0)%AVC.length]}" aria-hidden="true">${e(ini(u.nome))}</span>`;
const pillS=(t,c,x='')=>`<span class="pill c-${c} ${x}">${t}</span>`;
const STREQ={em_transito:'RF12c RF13',em_analise:'RF18',analisada:'RF19',externo:'RF13c RF13d',devolvida:'RF13e',recebida:'RF14 RF15b',coletada:'RF08c',armazenada:'RF08b'};
const pill=ev=>bloqueada(ev)?'<span class="pill solid" data-req="RF07b" data-db="lacre.situacao">Sem lacre ativo</span>':`<span class="pill c-${STATUS[ev.status][1]}"${rq(STREQ[ev.status],'evidencia.situacao')}>${STATUS[ev.status][0]}</span>`;
const ph=(t,sub,act='')=>`<header class="ph"><div><h1>${t}</h1><p>${sub}</p></div><div>${act}</div></header>`;
const stat=(key,grp,val,n,label,icon,c,req,db)=>`<button class="stat c-${c}"${rq(req,db)} data-a="filtro" data-g="${grp}" data-v="${key}" aria-pressed="${val===key}"><span class="tile">${ic(icon)}</span><span><b>${n}</b><span>${label}</span></span></button>`;
function onde(ev){
  if(ev.status==='devolvida')return 'Fora da posse do Instituto';
  if(ev.status==='em_transito')return 'A caminho de '+(ev.destinoExterno?ev.destinoExterno.nome+' (externo)':sn(ev.setorPendenteId));
  if(ev.status==='externo')return ev.destinoExterno.nome+' (externo)';
  if(ev.status==='em_analise')return `${sn(ev.setorAtualId)}, com ${user(ev.peritoId)?.nome}`;
  if(ev.setorAtualId)return sn(ev.setorAtualId);
  return 'Com '+ev.coletadoPor;
}
function qr(num){try{const q=qrcode(0,'M');q.addData(num);q.make();return q.createSvgTag({cellSize:2,margin:0,scalable:true})}catch(_){return ''}}

  const dbl=id=>{const cs=REV[id]||[];return cs.length?`<span class="dbline">No banco: ${cs.map(c=>`<span class="colchip" data-db="${c}">${c}</span>`).join('')}</span>`:''};

function acoes(ev){
  const u=me(),a=[],add=(id,label,icon,why,pri)=>a.push({id,label,icon,why,pri});
  if(ev.status==='devolvida')return a;
  if(bloqueada(ev)){
    const pode=ev.setorAtualId?u.setorId===ev.setorAtualId:u.id===ev.rompidoPorId;
    add('lacre','Associar novo lacre','lock',pode?'':ev.setorAtualId?`A evidência está no setor ${sn(ev.setorAtualId)}. Só pessoas desse setor podem substituir o lacre.`:`O lacre foi rompido antes de a evidência chegar a um setor. Só ${user(ev.rompidoPorId)?.nome}, que registrou o rompimento, pode substituí-lo.`,true);
    return a;
  }
  if(ev.status==='em_transito'){
    if(ev.destinoExterno)add('receber','Confirmar chegada ao destino externo','pin','',true);
    else add('receber','Confirmar recebimento','inbox',u.setorId===ev.setorPendenteId?'':`Esta evidência foi encaminhada ao setor ${sn(ev.setorPendenteId)}. Você pertence ao setor ${sn(u.setorId)} e não pode confirmar o recebimento.`,true);
  }else if(ev.status==='em_analise'){
    add('concluir','Concluir análise','check',u.id===ev.peritoId?'':`Só ${user(ev.peritoId)?.nome}, que assumiu a análise, pode concluí-la.`,true);
  }else{
    if(ev.setorAtualId&&ev.aguardandoAnalise)add('assumir','Assumir análise','flask',u.papel!=='perito'?`Seu perfil é ${PERFIL[u.papel]}. Só peritos assumem análise.`:u.setorId!==ev.setorAtualId?`A evidência está no setor ${sn(ev.setorAtualId)}. Só peritos desse setor podem assumir a análise.`:'',true);

    if(!ev.teveLacre)add('lacre','Associar lacre','lock');
  }
  if(lacreAtivo(ev))add('romper','Registrar rompimento do lacre','unlock');
  return a;
}

function modal(html,n=1){const d=$('#dlg'+n);d.innerHTML=html;if(!d.open)d.showModal();const fi=d.querySelector('.db input:not([type=radio]):not([type=checkbox]):not([type=file]):not([readonly]),.db select,.db textarea');if(fi){semTip=true;fi.focus();semTip=false}}
let semTip=false;
function closeM(n=1){const d=$('#dlg'+n);if(d.open)d.close()}
function ferr(f,msg){const p=f.querySelector('.err');p.textContent=msg;p.hidden=false;p.scrollIntoView({block:'nearest'})}
const head=(t,sub,n)=>`<div class="dh"><div><h3>${t}</h3>${sub?`<p>${sub}</p>`:''}</div><button type="button" class="x" data-a="close" data-n="${n}" aria-label="Fechar">${ic('x')}</button></div>`;
function form(f,o){const n=o.n||1;return `<form novalidate data-f="${f}" data-id="${o.id||''}">${head(o.t,o.sub,n)}<div class="db">${o.body}<p class="err" role="alert" hidden></p></div>
  <div class="df">${o.extra||''}<button type="button" class="btn" data-a="${o.cancelA||'close'}" data-n="${n}">${o.cancel||'Cancelar'}</button><button class="btn pri ${o.danger?'':''}">${o.ok}</button></div></form>`}

 token(d){const u=user(d.id),t=u.token,adm=me().papel==='admin';if(!adm&&u.id!==S.me)return;const p=t?lerToken(t.valor):null,[th,tp,ts]=t?t.valor.split('.'):[],nrev=(S.revogados||[]).filter(r=>r.usuarioId===u.id).length;

  </div><div class="df">${adm&&t?`<button type="button" class="btn" data-a="novotoken" data-id="${u.id}" data-req="RF01 RNF02" data-db="token_revogado.id_token token_revogado.revogado_em" style="margin-right:auto">Gerar novo token</button>`:''}${t?`<button type="button" class="btn" data-a="copiartoken" data-id="${u.id}">Copiar token</button>`:''}<button type="button" class="btn pri" data-a="close" data-n="1">Fechar</button></div></div>`)},

 rmsetor(d){const f=$('#dlg1 form');if(S.users.some(u=>u.setorId===d.id))return ferr(f,'Há pessoas vinculadas a este setor. Mova-as antes de remover, ou apenas desative o setor.');

 async verificar(){const ev=evById(ui.sel),c=S.cadeia[ev.id],itens={};
  for(let i=0;i<c.length;i++){const r=c[i],calc=await hashRec(r),elo=r.hashAnterior===(i?c[i-1].hashRegistro:ZERO);itens[r.seq]={ok:calc===r.hashRegistro&&elo,elo,calc}}

  const bad=Object.values(itens).filter(x=>!x.ok).length;toast(bad?'Divergência encontrada na cadeia.':'Cadeia íntegra.')},

 relatorio(){const ev=evById(ui.sel),c=S.cadeia[ev.id],v=S.verif[ev.id];
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const csv=['numero_sequencia;acao;registrado_por;nome_responsavel_posse;setor_atual;destino;endereco_local;data_hora_registro;observacao;gps_obtido;hash_registro_anterior;hash_registro;resultado_verificacao'].concat(c.map(r=>[r.seq,q(r.acao),q(r.registradoPor||r.responsavel),q(r.responsavel),q(r.setorId?sn(r.setorId):''),q(r.destino),q(r.local),r.dataHora,q(r.observacao),'false',r.hashAnterior,r.hashRegistro,v&&v.itens[r.seq]?(v.itens[r.seq].ok?'confere':'DIVERGENTE'):'nao verificado'].join(';'))).join('\n');
  const bad=v?Object.values(v.itens).filter(x=>!x.ok).length:0;
  modal(`<div class="dwrap">${head('Relatório de custódia',e(ev.codigo)+', '+e(ev.descricao),1)}<div class="db">

   <div><dt>Integridade</dt><dd>${v?(bad?`${bad} registro(s) divergente(s)`:'Cadeia íntegra')+', '+fmt(v.em):'Ainda não verificada'}</dd></div></dl>
   ${v?'':'<p class="warn">Feche e use "Verificar integridade" para incluir o resultado no relatório.</p>'}
   <div class="tw" style="border:1px solid var(--line);border-radius:10px"><table><thead><tr><th>Nº</th><th>Ação</th><th>Responsável</th><th>Data</th><th>Hash</th></tr></thead><tbody>${c.map(r=>`<tr><td>${r.seq}</td><td>${e(r.acao)}</td><td>${e(r.responsavel)}</td><td class="small">${fmt(r.dataHora)}</td><td class="mono">${short(r.hashRegistro)}</td></tr>`).join('')}</tbody></table></div>
   <div class="f" style="margin:16px 0 0"><label for="csv">CSV completo (colunas com os nomes do banco)</label><textarea id="csv" readonly rows="4" class="mono">${e(csv)}</textarea><p class="hint">Download e PDF estão desligados nesta prévia. Copie o CSV e cole em uma planilha.</p></div></div>
   <div class="df"><button class="btn" data-a="close">Fechar</button><button class="btn pri" data-a="copiar" data-req="RF23">Copiar CSV</button></div></div>`)},

async function salvarNova(confirmado){
  const f=$('#dlg1 form'),d=Object.fromEntries(new FormData(f)),u=me();
  if(S.evidencias.some(x=>x.codigo.toLowerCase()===d.codigo.trim().toLowerCase()))return ferr(f,`Já existe uma evidência com o código ${d.codigo}.`);
  if(d.fora==='sim'&&!d.justificativa.trim())return ferr(f,'Explique por que o cadastro está sendo feito fora do local indicado.');
  const ext=d.origem==='externo',num=d.numero.trim();
  if(num){
    if(ext){if(S.lacres.some(x=>x.numero.toLowerCase()===num.toLowerCase()))return ferr(f,`O lacre ${num} já foi registrado em outra evidência e não pode ser reaproveitado.`)}
    else{const l=S.lacres.find(x=>!x.externo&&x.numero.toLowerCase()===num.toLowerCase());
      if(!l)return ferr(f,`Não existe lacre do Instituto com o número ${num}. Confira a etiqueta ou marque "Lacre externo".`);
      if(l.status==='vinculado')return ferr(f,`O lacre ${l.numero} já está vinculado à evidência ${evById(l.evidenciaId)?.codigo}.`);
      if(l.status==='rompido')return ferr(f,`O lacre ${l.numero} foi rompido e não pode ser reutilizado.`)}
  }
  const temOc=draftOc&&Object.values(draftOc).some(v=>String(v||'').trim());
  if(!temOc&&!confirmado)return modal(`<div class="dwrap">${head('Registrar sem ocorrência?','',2)}<div class="db"><p>Nenhum dado de ocorrência foi informado. Você pode voltar e vincular agora, ou continuar assim mesmo.</p></div><div class="df"><button class="btn" data-a="close" data-n="2">Voltar ao formulário</button><button class="btn pri" data-a="semOc" data-req="RF02e">Registrar sem ocorrência</button></div></div>`,2);
  const file=f.foto.files[0];let hashFoto='',fotoNome='',fotoTipo='',fotoTamanho=0;
  if(file){hashFoto=hex(await crypto.subtle.digest('SHA-256',await file.arrayBuffer()));fotoNome=file.name;fotoTipo=file.type||'desconhecido';fotoTamanho=file.size}
  const lat=(d.lat||'').trim().replace(',','.'),lng=(d.lng||'').trim().replace(',','.');
  if((lat&&!lng)||(!lat&&lng))return ferr(f,'Informe latitude e longitude juntas, ou deixe as duas em branco.');
  if(lat&&(isNaN(+lat)||Math.abs(+lat)>90||isNaN(+lng)||Math.abs(+lng)>180))return ferr(f,'Latitude vai de -90 a 90 e longitude de -180 a 180.');
  const ev=await novaEvidencia(u,{codigo:d.codigo.trim(),tipo:d.tipo,descricao:d.descricao.trim(),endereco:d.endereco.trim(),lat,lng,ocorrenciaId:vincularOcorrencia(draftOc,u),hashFoto,fotoNome,fotoTipo,fotoTamanho,fora:d.fora==='sim',justificativa:(d.justificativa||'').trim()});
  if(num)await opAssociar(ev,u,{externo:ext,emissor:d.emissor,numero:num});
  ui.sel=ev.id;save();
  modal(form('transp',{id:ev.id,t:`Evidência ${e(ev.codigo)} registrada`,sub:'Ela está sendo transportada agora?',ok:'Sim, registrar encaminhamento',cancel:'Não, ela fica comigo',cancelA:'naoTransp',body:`
   <div class="f" data-req="RF12b" data-db="cadeia_custodia.nome_responsavel_posse"><label for="transp">Quem transporta</label><input name="transportador" id="transp" value="${e(u.nome)}" required></div>
   <div class="f" data-req="RF12 RF12b" data-db="cadeia_custodia.setor_destino_id evidencia.setor_destino_pendente_id"><label for="setorId">Para qual setor</label>${selSetor('setorId',S.setores.find(s=>/recep/i.test(s.nome))?.id)}</div>`}));
}

  $('#user').innerHTML=S.users.filter(x=>x.ativo!==false).map(x=>`<option value="${x.id}" ${x.id===S.me?'selected':''}>${e(x.nome)} (${PERFIL[x.papel]}, ${e(sn(x.setorId))})</option>`).join('');
  $('.reset').innerHTML=ic('refresh')+'Restaurar dados de exemplo';
  $('.sair').innerHTML=ic('logout')+'Sair';
  $('#proto').innerHTML=ic('info')+'<span>Protótipo: os dados ficam só neste navegador. Câmera, GPS, PDF e login com senha estão simulados; o hash SHA-256 e o token JWT de cada pessoa são reais.</span>';
}

  $('#login').innerHTML=`<section class="lg-art" aria-hidden="false">

    <div class="lg-row"><label><input type="checkbox" name="lembrar">Manter conectado</label><button type="button" class="lnk" data-a="esqueci">Esqueci minha senha</button></div>

    <div class="lg-note">${ic('info')}<span>Protótipo sem banco de dados: a senha não é conferida. Se o e-mail ou a matrícula for de alguém cadastrado, você entra como essa pessoa.</span></div>

async function entrarComo(u){S.me=u.id;S.logado=true;u.ultimoLoginEm=new Date().toISOString();await emitirToken(u);document.body.classList.remove('out');if(!location.hash)location.hash='evidencias';render();window.scrollTo(0,0);toast(`Bem-vinda, ${u.nome.split(' ')[0]}. Token de acesso gerado.`.replace('Bem-vinda',/a$/.test(u.nome.split(' ')[0])?'Bem-vinda':'Bem-vindo'))}
function render(){
  if(!S.logado){save();document.body.classList.add('out');telaEntrada();return}
  document.body.classList.remove('out');
  save();let v=location.hash.slice(1);if(!views[v])v='evidencias';
  chrome(v);$('#main').innerHTML=views[v]();
}
(async()=>{
  if(!window.crypto||!crypto.subtle){$('#main').innerHTML='<p class="err">Este navegador não oferece SHA-256 (Web Crypto). Abra a página em um navegador atual, por HTTPS.</p>';return}
  try{S=JSON.parse(localStorage.getItem(KEY))}catch(_){S=null}
  if(!S||S.ver!==3){await seed()}
  await garantirTokens();render();
})();
</script>
